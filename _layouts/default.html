<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: page.summary | default: site.description | escape }}">
    <meta name="theme-color" content="#101216">
    <link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" sizes="any">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script src="{{ '/assets/js/header-cat.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header container">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.data.profile.name | escape }} home"><span class="wordmark-badge">t</span><span class="wordmark-name">ony's</span></a>
      {% include navigation.html %}
    </header>
    <main id="main" class="container" tabindex="-1">{{ content }}</main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <p>{{ site.data.profile.name | escape }} <span class="muted">/ {{ site.data.profile.role | escape }}</span></p>
        <div class="link-row">{% for link in site.data.profile.links %}<a href="{{ link.url | escape }}">{{ link.title | escape }} <span aria-hidden="true">↗</span></a>{% endfor %}<a href="mailto:{{ site.data.profile.email | escape }}">Email <span aria-hidden="true">↗</span></a></div>
      </div>
    </footer>
  </body>
</html>
